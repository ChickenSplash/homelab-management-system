name: hms

# Shared by every service: same image, same settings, same database volume.
x-app: &app
    image: hms:latest
    pull_policy: never
    environment: &env
        APP_NAME: HMS
        APP_ENV: production
        APP_DEBUG: 'false'
        # Only used for links generated outside a request.
        APP_URL: '${APP_URL:-http://hms:3000}'
        APP_KEY: '${APP_KEY:-}'
        DB_CONNECTION: sqlite
        DB_DATABASE: /app/data/database.sqlite
        # 30 days. A guest's account lasts as long as their session.
        SESSION_DRIVER: database
        SESSION_LIFETIME: 43200
        SESSION_SECURE_COOKIE: 'true'
        CACHE_STORE: database
        QUEUE_CONNECTION: database
        # Browser apps that sign in with a session cookie (comma separated hosts).
        SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS:-chat.chickensplash.dpdns.org,music.chickensplash.dpdns.org}'
        # Reverb: the API and the queue publish to hms-reverb over the edge network;
        # browsers reach it through their app's own nginx at /app.
        BROADCAST_CONNECTION: reverb
        REVERB_APP_ID: hms
        REVERB_APP_KEY: '${REVERB_APP_KEY:?set REVERB_APP_KEY in .env}'
        REVERB_APP_SECRET: '${REVERB_APP_SECRET:?set REVERB_APP_SECRET in .env}'
        REVERB_HOST: hms-reverb
        REVERB_PORT: 8080
        REVERB_SCHEME: http
        REVERB_ALLOWED_ORIGINS: '${REVERB_ALLOWED_ORIGINS:-chat.chickensplash.dpdns.org}'
        # Ping a quiet connection after 20 s, so a dead one shows offline sooner (see AppServiceProvider).
        REVERB_APP_PING_INTERVAL: 20
        # Contact form messages are mailed to ADMIN_EMAIL.
        # Until MAIL_MAILER=smtp is set, the mail only goes to the container log.
        ADMIN_EMAIL: '${ADMIN_EMAIL:-}'
        MAIL_MAILER: '${MAIL_MAILER:-log}'
        MAIL_SCHEME: smtps
        MAIL_HOST: smtp.gmail.com
        MAIL_PORT: 465
        MAIL_USERNAME: '${MAIL_USERNAME:-}'
        MAIL_PASSWORD: '${MAIL_PASSWORD:-}'
        MAIL_FROM_ADDRESS: '${MAIL_USERNAME:-hello@example.com}'
        MAIL_FROM_NAME: 'Portfolio'
        LOG_CHANNEL: stderr
        # Music: each creator's MP3s sit under /music/<public_id>/. Cover art lives on the
        # database volume, and music-ui's nginx serves the streams (X-Accel-Redirect).
        MUSIC_ROOT: /music
        MUSIC_COVERS: /app/data/music-covers
        MUSIC_ACCEL_PREFIX: /_music/
    volumes:
        # Not /app/database: a volume there hides any migration added after it was created.
        - database:/app/data
        # Create the folder first (as your user), or Docker makes a root-owned one copyparty can't write to.
        - '${MUSIC_PATH:-/srv/files/Music}:/music:ro'
    networks:
        - edge
    restart: unless-stopped

services:
    # The API. No published port: only the tunnel and other edge containers reach it,
    # which is what makes CF-Connecting-IP trustworthy for rate limits.
    hms:
        <<: *app
        build: .
        container_name: hms
        hostname: hms
        environment:
            <<: *env
            RUN_MIGRATIONS: 'true'
        healthcheck:
            test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:3000/up']
            interval: 30s
            timeout: 5s
            start_period: 30s

    hms-reverb:
        <<: *app
        container_name: hms-reverb
        hostname: hms-reverb
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        # The image's own check probes Caddy, which only runs in the API container.
        healthcheck:
            disable: true
        depends_on:
            hms:
                condition: service_healthy

    hms-queue:
        <<: *app
        container_name: hms-queue
        command: ['php', 'artisan', 'queue:work', '--sleep=1', '--tries=3', '--max-time=3600']
        healthcheck:
            disable: true
        depends_on:
            hms:
                condition: service_healthy

    hms-scheduler:
        <<: *app
        container_name: hms-scheduler
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true
        depends_on:
            hms:
                condition: service_healthy

volumes:
    database:

networks:
    # Created by the cloudflared stack.
    edge:
        name: edge
        external: true
